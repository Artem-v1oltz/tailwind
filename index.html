<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Cards</title>
   
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 py-12 px-4">

    <div class="max-w-6xl mx-auto">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Картки на Tailwind CSS</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white rounded-lg shadow-md p-6 flex flex-col justify-between">
                <div>
                    <h3 class="text-xl font-semibold text-gray-800 mb-2">Перша картка</h3>
                    <p class="text-gray-600 mb-4">опис</p>
                </div>
                <button
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 transition">Детальніше</button>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6 flex flex-col justify-between">
                <div>
                    <h3 class="text-xl font-semibold text-gray-800 mb-2">Друга картка</h3>
                    <p class="text-gray-600 mb-4">опис</p>
                </div>
                <button
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 transition">Детальніше</button>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6 flex flex-col justify-between">
                <div>
                    <h3 class="text-xl font-semibold text-gray-800 mb-2">Третя картка</h3>
                    <p class="text-gray-600 mb-4">опис</p>
                </div>
                <button
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 transition">Детальніше</button>
            </div>
        </div>
    </div>

</body>

</html>
